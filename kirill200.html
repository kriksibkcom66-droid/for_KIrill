<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加油 — 80кг в "чистую"</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Shippori+Mincho:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFF3E4;
  --paper2:#E3ECD3;
  --ink:#1c1a17;
  --ink-soft:#3a352e;
  --red:#5C8A00;
  --gray:#7E8A6E;
  --line:#1B1F16;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Serif', serif;
  min-height:100svh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:6vh 6vw;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(0,0,0,0.03), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(0,0,0,0.04), transparent 45%);
}
.jp{font-family:'Shippori Mincho', serif;}
.kicker{
  font-size:0.8rem; letter-spacing:0.4em; color:var(--gray); text-transform:uppercase; margin-bottom:1.2rem;
}
.hanko{
  width:80px; height:80px; border-radius:6px; border:4px solid var(--red); color:var(--red);
  display:flex; align-items:center; justify-content:center; font-family:'Shippori Mincho',serif;
  font-size:1.4rem; font-weight:800; transform:rotate(-6deg); margin:0 auto 1.6rem;
  writing-mode:vertical-rl;
}
h1{
  font-size:clamp(1.4rem, 3.6vw, 2.1rem);
  line-height:1.35;
  max-width:46ch;
  margin:0 auto 2.6rem;
}
.panel{
  max-width:720px; width:100%;
  background:var(--paper2); border:5px solid var(--line);
  box-shadow:9px 9px 0 rgba(0,0,0,0.85);
  padding:0.6rem;
}
.panel video{
  display:block; width:100%; height:auto; background:#000; aspect-ratio:9/16; max-height:70vh; margin:0 auto;
}
.caption{
  margin-top:1.8rem; font-style:italic; color:var(--ink-soft); font-size:1rem;
}
.owari{ font-family:'Bebas Neue'; letter-spacing:0.25em; color:var(--gray); margin-top:2.4rem; font-size:0.85rem; }
</style>
</head>
<body>
  <div class="kicker">видео-доказательство</div>
  <div class="hanko jp">加油</div>
  <h1>А это небольшое напоминание, что всегда есть к чему стремиться, жду от тебя видос где жмешь 80 в чистую)))))</h1>
  <div class="panel">
    <video src="IMG_0236.MOV" controls playsinline></video>
  </div>
  <p class="caption">80кг лёжа — ждём видео 🏋️</p>
  <p class="caption>На главную</p>
  <div class="owari">加油 · KEEP PUSHING</div>
</body>
</html>
